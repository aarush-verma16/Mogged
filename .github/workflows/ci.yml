name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  runtime:
    name: runtime tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test MoggedRuntime
        run: swift test --package-path runtime
      - name: Build launcher
        run: swift build --package-path apps/launcher
